[project]
name = "covered"
version = "0.1.1"
description = "Upload coverage reports to 'covered'"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yurii Motov" }]
keywords = ["coverage", "ci", "github"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "aiobotocore>=2.13.0",
    "httpx>=0.24.0",
    "stamina>=23.1.0",
    "typer>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/YuriiMotov/covered"
Repository = "https://github.com/YuriiMotov/covered"
Issues = "https://github.com/YuriiMotov/covered/issues"

[project.scripts]
covered = "covered.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
